<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJG Games</title>
<style>
/* AJG Games — Steam-like store. Palette from the real Steam client. */
:root{
  --bg:#171a21; --panel:#1b2838; --panel2:#2a475e; --panel3:#0f1922;
  --accent:#66c0f4; --text:#c7d5e0; --dim:#8f98a3; --bright:#fff;
  --green:#5aa15a; --green-hi:#75b022; --green-lo:#588a1b; --green-dk:#4c6b22;
  --red:#c0392b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 Arial,Helvetica,sans-serif;min-height:100vh}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font:inherit}
input,textarea,select{font:inherit}

/* ---- top mini menu (Steam / View / Friends / Games / Help) ---- */
.topmini{display:flex;gap:16px;align-items:center;padding:5px 16px;background:#171a21;color:var(--dim);font-size:12px}
.topmini b{color:var(--text);font-weight:700}
.topmini span{cursor:pointer}
.topmini span:hover{color:var(--bright)}

/* ---- main top bar ---- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(#1b2838,#171a21);border-bottom:1px solid #000;flex-wrap:wrap}
.nav-arrow{color:var(--dim);font-size:16px;cursor:pointer;padding:2px 6px;background:transparent;border:none}
.nav-arrow:hover{color:var(--bright)}
.logo{font-size:24px;font-weight:700;color:var(--bright);letter-spacing:.5px;cursor:pointer;white-space:nowrap}
.logo em{font-style:normal;color:var(--accent)}
.tabs{display:flex;gap:2px;margin-left:14px}
.tab{padding:8px 14px;color:var(--text);font-weight:700;text-transform:uppercase;font-size:13px;cursor:pointer;border-radius:2px;background:transparent;border:none}
.tab:hover{background:var(--panel2);color:var(--bright)}
.tab.on{background:var(--panel2);color:var(--bright);box-shadow:inset 0 -3px 0 var(--accent)}
.search{margin-left:auto;display:flex;gap:0}
.search input{background:#316282;border:1px solid #000;color:#fff;padding:6px 10px;width:230px;border-radius:2px 0 0 2px;outline:none}
.search input::placeholder{color:#a9c6d8}
.search button{background:#316282;border:1px solid #000;border-left:none;color:#fff;padding:6px 10px;cursor:pointer;border-radius:0 2px 2px 0}
.acct{margin-left:12px;display:flex;align-items:center;gap:8px}
.acct .who{color:var(--text);font-size:13px}
.avatar{width:32px;height:32px;border-radius:2px;background:var(--panel2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;border:1px solid #000}

/* ---- buttons ---- */
.btn{background:linear-gradient(var(--panel2),var(--panel));color:var(--text);border:1px solid #000;padding:7px 14px;cursor:pointer;border-radius:2px}
.btn:hover{color:var(--bright);filter:brightness(1.15)}
.btn-green{background:linear-gradient(var(--green-hi),var(--green-lo));color:#fff;border:1px solid var(--green-dk);font-weight:700;padding:9px 26px;font-size:15px;border-radius:2px;cursor:pointer}
.btn-green:hover{filter:brightness(1.12)}
.btn-green:disabled{opacity:.55;cursor:default}
.btn-sm{padding:5px 10px;font-size:12px}

/* ---- layout ---- */
main{max-width:940px;margin:0 auto;padding:16px}
.notice{background:#3a2a12;border:1px solid #8a6d1b;color:#ffd479;padding:10px 14px;margin:0 0 14px;border-radius:2px}
.notice.err{background:#3a1712;border-color:#8a2b1b;color:#ffb3a7}
h1{font-size:20px;color:var(--bright);margin:4px 0 12px}
h2{font-size:15px;color:var(--bright);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.dim{color:var(--dim)}
.small{font-size:12px}
.hidden{display:none !important}

/* ---- hero (featured) ---- */
.hero{background:var(--panel);border:1px solid #000;display:flex;gap:0;margin-bottom:8px;cursor:pointer;overflow:hidden}
.hero .cover{flex:0 0 460px;max-width:55%;min-height:215px;background:linear-gradient(135deg,#2a475e,#1b2838);display:flex;align-items:center;justify-content:center;color:#8f98a3;font-size:15px}
.hero .cover img{width:100%;height:100%;object-fit:cover;display:block}
.hero .info{padding:16px 20px;flex:1}
.hero .info h1{margin:0 0 6px;font-size:24px}
.hero .tags{margin:8px 0}
.hero .price{color:var(--green);font-weight:700;font-size:15px}
.hero-empty{padding:34px 28px;text-align:left}
.hero-empty h1{font-size:28px;margin:0 0 8px}
.hero-empty p{color:var(--text);font-size:14px;margin:0 0 16px}

/* ---- tiles / shelves ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid #000;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile .thumb{height:100px;background:linear-gradient(135deg,#2a475e,#1b2838);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;overflow:hidden}
.tile .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tile .t{padding:8px 10px}
.tile .t b{color:var(--bright);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t .free{color:var(--green);font-weight:700}
.badge{display:inline-block;padding:1px 7px;background:var(--panel2);border-radius:2px;font-size:11px;color:var(--text);margin:0 4px 4px 0}
.badge.priv{background:#5a2a1b}
.badge.unl{background:#4a3a12}

/* ---- empty state ---- */
.empty{background:var(--panel);border:1px solid #000;padding:34px 20px;text-align:center;margin-top:8px}
.empty h2{font-size:18px;text-transform:none;letter-spacing:0;margin:0 0 6px}
.empty p{color:var(--dim);margin:0}

/* ---- game page ---- */
.game-hero{background:var(--panel);border:1px solid #000;padding:0;overflow:hidden;margin-bottom:14px}
.game-hero .banner{height:215px;background:linear-gradient(135deg,#2a475e,#1b2838);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.game-hero .banner img{width:100%;height:100%;object-fit:cover;display:block}
.game-hero .body{padding:16px 20px}
.game-hero .body h1{font-size:26px;margin:0 0 4px}
.game-hero .meta{color:var(--dim);margin:6px 0}
.install-box{background:var(--panel2);border:1px solid #000;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.install-box .free{font-size:18px;font-weight:700;color:var(--bright)}
.install-box .sub{color:var(--dim);font-size:12px}
.desc{background:var(--panel);border:1px solid #000;padding:14px 18px;white-space:pre-wrap}
.panelbox{background:var(--panel);border:1px solid #000;padding:14px 18px;margin-top:14px}
.panelbox h3{margin:0 0 10px;color:var(--bright);font-size:14px}

/* ---- forms ---- */
.form{background:var(--panel);border:1px solid #000;padding:18px 20px;max-width:640px}
.form label{display:block;color:var(--text);font-weight:700;margin:12px 0 2px}
.form label .hint{font-weight:400;color:var(--dim);font-size:12px}
.form input[type=text],.form input[type=password],.form input[type=url],.form textarea,.form select{width:100%;background:var(--panel3);border:1px solid var(--panel2);color:var(--text);padding:8px 10px;margin:4px 0 4px;border-radius:2px;outline:none}
.form input:focus,.form textarea:focus{border-color:var(--accent)}
.form textarea{min-height:90px;resize:vertical}
.form .err{color:#ff9d8a;font-size:12px;min-height:16px}
.radio-row{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0}
.radio-row label{font-weight:400;display:flex;gap:6px;align-items:flex-start;cursor:pointer}
.radio-row label b{display:block}
.radio-row label span{color:var(--dim);font-size:12px;display:block}
.vis-pub b{color:#7ec850}.vis-unl b{color:#e8c34a}.vis-priv b{color:#e07a5f}

/* ---- library ---- */
.lib-row{background:var(--panel);border:1px solid #000;padding:10px 14px;display:flex;align-items:center;gap:14px;margin-bottom:8px}
.lib-row .thumb-sm{width:92px;height:43px;background:linear-gradient(135deg,#2a475e,#1b2838);flex:0 0 92px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px}
.lib-row .thumb-sm img{width:100%;height:100%;object-fit:cover;display:block}
.lib-row b{color:var(--bright)}
.lib-row .sp{flex:1}

/* ---- toast ---- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a475e;color:#fff;border:1px solid #000;padding:10px 18px;border-radius:2px;display:none;z-index:50;max-width:90vw}
#toast.show{display:block}
</style>
</head>
<body>
<div class="topmini">
  <b>AJG Games</b><span onclick="AJGGames.go('store')">View</span><span onclick="AJGGames.go('library')">Library</span><span onclick="AJGGames.go('publish')">Publish a game</span><span onclick="AJGGames.go('community')">Help</span>
</div>
<div class="topbar">
  <button class="nav-arrow" id="nav-back" title="Back" type="button">&#9664;</button>
  <button class="nav-arrow" id="nav-fwd" title="Forward" type="button">&#9654;</button>
  <div class="logo" onclick="AJGGames.go('store')">AJG <em>Games</em></div>
  <div class="tabs">
    <button class="tab" id="tab-store" type="button" onclick="AJGGames.go('store')">Store</button>
    <button class="tab" id="tab-library" type="button" onclick="AJGGames.go('library')">Library</button>
    <button class="tab" id="tab-community" type="button" onclick="AJGGames.go('community')">Community</button>
  </div>
  <div class="search">
    <input id="search-box" type="text" placeholder="search the store" autocomplete="off">
    <button id="search-btn" type="button" title="Search">&#128269;</button>
  </div>
  <div class="acct" id="acct-area"></div>
</div>
<main id="view"></main>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
"use strict";
/* ============================================================
   AJG Games — install-and-play game store (Steam-like)
   Sign-in: AJG Mail account (Firebase Auth, project ajg-mail)
   Accounts live in the ajg-mail database (profiles + address index).
   Games + install links live in their own database, project ajg-games:
     games/{gameId}      -> game record (see buildGameRecord)
     whitelist/{gameId}/{uid} -> { address, addedAt }
     library/{uid}/{gameId}   -> { addedAt, title }
   Visibility (YouTube-style, per game):
     public   = listed on the store + searchable by name
     unlisted = hidden from listings/search, anyone with the link can view
     private  = link exists but needs AJG Mail sign-in + owner whitelist;
                anyone else (or an invalid link) sees
                "You are not allowed to view this game."
   Install: opens the publisher's install link in a new tab.
   Every game is published with an install link — no file uploads.
   No payments, no buying — everything is free in v1.
   NOTE: games use the fresh ajg-games key (unrestricted, so the games
   database should just work). Account lookups still go through the
   ajg-mail key, whose Realtime Database access is unverified — if
   sign-in works but names or whitelist lookups fail, check that first.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCT5av2njjksp4XDjuB1RJ3dSX6e-JfXzc",
  authDomain: "ajg-mail.firebaseapp.com",
  databaseURL: "https://ajg-mail-default-rtdb.firebaseio.com",
  projectId: "ajg-mail",
  storageBucket: "ajg-mail.firebasestorage.app",
  messagingSenderId: "650156860047",
  appId: "1:650156860047:web:1a42b3fb2a5af4b04706fa",
  measurementId: "G-B13TRYF2FL"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const rtdb = firebase.database();   /* ajg-mail: accounts only */
/* Games live in their own Firebase project (ajg-games) — its own
   database. Accounts stay in ajg-mail; this app never signs in
   to the games project, it only reads/writes game data there. */
const gamesConfig = {
  apiKey: "AIzaSyBQtK24KynNd9mytnNfnhg8qnCTqaOvOgc",
  authDomain: "ajg-games.firebaseapp.com",
  databaseURL: "https://ajg-games-default-rtdb.firebaseio.com",
  projectId: "ajg-games",
  storageBucket: "ajg-games.firebasestorage.app",
  messagingSenderId: "175496946515",
  appId: "1:175496946515:web:ec1e9b8bf12431e87477a6"
};
const gamesApp = firebase.initializeApp(gamesConfig, "ajg-games");
const gamesDb = firebase.database(gamesApp);
const DOMAIN = "ajgmail.com";

/* ---------- publishing is link-only (Avery's call, 2026-11-07) ----------
   Every game is published with an install link — no file uploads.
   That settles the file question: a database can't hold 1 GB files,
   so publishers paste a download link instead (e.g. a GitHub
   release link) and Install opens it in a new tab. */
const NOT_ALLOWED_MSG = "You are not allowed to view this game.";

/* ---------- state ---------- */
let me = null;                 /* { uid, address, local, name } when signed in */
let games = {};                /* games snapshot, keyed by id (ajg-games database) */
let library = {};              /* my installed games, keyed by game id */
let dbError = null;            /* set when the games listener errors */
let gamesLoaded = false;
let currentGameId = null;      /* game page being viewed */
let currentWhitelist = {};     /* whitelist for currentGameId, keyed by uid */
let searchQuery = "";

const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const t = $("toast"); if(!t) return;
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3500);
}

/* ============================================================
   PURE FUNCTIONS — visibility, search, validation, install.
   These are the rules Avery asked for; they are exposed on
   window.AJGGames so they can be tested without a browser.
   ============================================================ */

/* Who may view a game page. viewer = null when signed out.
   whitelistUids = array of uids allowed on this private game. */
function canViewGame(game, viewer, whitelistUids){
  if(!game || typeof game !== "object") return { ok:false, reason:"not-allowed" };
  if(isRoot(viewer)) return { ok:true };
  const vis = game.visibility || "public";
  if(vis === "public") return { ok:true };
  if(vis === "unlisted") return { ok:true };
  if(vis === "private"){
    if(!viewer) return { ok:false, reason:"not-allowed" };
    if(viewer.uid === game.ownerUid) return { ok:true };
    if(Array.isArray(whitelistUids) && whitelistUids.indexOf(viewer.uid) !== -1) return { ok:true };
    return { ok:false, reason:"not-allowed" };
  }
  return { ok:false, reason:"not-allowed" };
}
/* The root account — ajgplayz — can edit and see any game. */
const ROOT_ADDRESS = "ajgplayz@ajgmail.com";
function isRoot(viewer){
  return !!(viewer && viewer.address && String(viewer.address).toLowerCase() === ROOT_ADDRESS);
}
function isOwner(game, viewer){ return !!(game && viewer && game.ownerUid === viewer.uid); }
function canManageWhitelist(game, viewer){ return isOwner(game, viewer) || isRoot(viewer); }
/* Only the person who published a game — or the root account — may edit it. */
function canEditGame(game, viewer){ return isOwner(game, viewer) || isRoot(viewer); }
/* Fields an owner may change. Owner, release date and install count
   are never edited. */
function buildGameUpdate(input){
  return {
    title: String(input.title || "").trim(),
    description: String(input.description || "").trim(),
    tags: parseTags(input.tags),
    cover: input.cover || "",
    visibility: input.visibility === "private" ? "private"
      : input.visibility === "unlisted" ? "unlisted" : "public",
    delivery: "link",
    installLink: input.installLink || ""
  };
}

/* Store listing: public games only, optionally filtered by name.
   The root account sees every game, including private ones. */
function storeGames(allGames, query, viewer){
  const q = String(query || "").trim().toLowerCase();
  const root = isRoot(viewer);
  const list = Object.keys(allGames || {}).map(k => allGames[k])
    .filter(g => g && (root || g.visibility === "public"));
  const found = q ? list.filter(g => String(g.title || "").toLowerCase().indexOf(q) !== -1) : list;
  found.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  return found;
}
function visibilityLabel(vis){
  return vis === "private" ? "Private" : vis === "unlisted" ? "Unlisted" : "Public";
}
function parseTags(raw){
  return String(raw || "").split(",").map(t => t.trim()).filter(t => t.length > 0).slice(0, 10);
}
function isValidInstallLink(url){
  const u = String(url || "").trim();
  if(!u) return false;
  if(!/^https?:\/\//i.test(u)) return false;
  try{ const p = new URL(u); return p.protocol === "http:" || p.protocol === "https:"; }
  catch(e){ return false; }
}
/* What the Install button does for a game. Pure decision; the real
   installGame() below carries it out (opens the link in a new tab). */
function installAction(game){
  if(!game) return { type:"none" };
  if(isValidInstallLink(game.installLink))
    return { type:"link", url: game.installLink };
  return { type:"none" };
}

/* Build the game record stored in RTDB. */
function buildGameRecord(input, owner){
  return {
    title: String(input.title || "").trim(),
    description: String(input.description || "").trim(),
    tags: parseTags(input.tags),
    cover: input.cover || "",
    ownerUid: owner.uid,
    ownerAddress: owner.address,
    ownerName: owner.name || owner.local || owner.address,
    visibility: input.visibility === "private" ? "private"
      : input.visibility === "unlisted" ? "unlisted" : "public",
    delivery: "link",
    installLink: input.installLink || "",
    createdAt: Date.now(),
    downloads: 0
  };
}
function validatePublish(input){
  if(!input.title || String(input.title).trim().length < 2)
    return "Give your game a title (at least 2 characters).";
  if(String(input.title).trim().length > 80)
    return "That title is too long — keep it under 80 characters.";
  if(["public","unlisted","private"].indexOf(input.visibility) === -1)
    return "Pick who can see it: Public, Unlisted or Private.";
  if(!isValidInstallLink(input.installLink))
    return "Paste a full install link starting with http:// or https:// — e.g. a GitHub release link.";
  return "";
}

/* ---------- AJG Mail address helpers (same rules as the AJG Mail app) ---------- */
function localPart(raw){
  let v = String(raw || "").trim().toLowerCase();
  if(v.indexOf("@") !== -1){
    const parts = v.split("@");
    if(parts[1] !== DOMAIN) return null;
    v = parts[0];
  }
  return v;
}
function validLocal(v){
  return /^[a-z0-9][a-z0-9._]{2,23}$/.test(v) && !v.endsWith(".") && !v.includes("..");
}
function addressOf(local){ return local + "@" + DOMAIN; }
function displayName(local, name){
  const n = String(name || "").trim();
  if(n) return n;
  return local.replace(/[._]+/g," ").replace(/\b\w/g, c => c.toUpperCase());
}
function authErrorFor(err){
  const code = (err && err.code) || "";
  switch(code){
    case "auth/user-not-found": return "No account with that address yet — create one in AJG Mail first.";
    case "auth/wrong-password":
    case "auth/invalid-credential": return "Wrong password. Try again.";
    case "auth/invalid-email": return "That address won't work — check it and try again.";
    case "auth/network-request-failed": return "Network problem — check your connection and try again.";
    case "auth/too-many-requests": return "Too many tries — wait a bit and try again.";
    case "auth/requests-from-referer-blocked":
    case "auth/requests-from-referer-unknown": return "Sign-in is blocked by the API key's website list. (Tell Muse — this is the key restriction, not your password.)";
    default: return "Something went wrong (" + (code || "unknown") + "). Try again.";
  }
}

/* ============================================================
   AUTH — AJG Mail sign-in (same Firebase project as AJG Mail)
   ============================================================ */
async function signInWithAjgMail(addressInput, password){
  const local = localPart(addressInput);
  if(local === null || !validLocal(local)) throw new Error("bad-address");
  const cred = await auth.signInWithEmailAndPassword(addressOf(local), password);
  return cred.user;
}
async function loadProfile(uid, email){
  try{
    const snap = await rtdb.ref("ajgmail/users/" + uid).once("value");
    let profile = snap.val();
    if(!profile){
      await new Promise(r => setTimeout(r, 700));
      profile = (await rtdb.ref("ajgmail/users/" + uid).once("value")).val();
    }
    if(!profile){
      const local = localPart(email || "") || "user";
      profile = { address: email, local: local, name: displayName(local, ""), createdAt: Date.now() };
      await rtdb.ref("ajgmail/users/" + uid).set(profile);
      await rtdb.ref("ajgmail/addresses/" + local).set(uid);
    }
    return profile;
  }catch(err){
    throw err;
  }
}
auth.onAuthStateChanged(async user => {
  if(!user){
    me = null; library = {};
    renderAccount(); render();
    return;
  }
  try{
    const profile = await loadProfile(user.uid, user.email);
    me = { uid: user.uid, address: profile.address, local: profile.local, name: profile.name };
  }catch(err){
    me = { uid: user.uid, address: user.email, local: localPart(user.email || "") || "user", name: displayName(localPart(user.email || "") || "user", "") };
    dbError = "signed-in but the profile couldn't load";
  }
  renderAccount();
  listenLibrary();
  render();
});

/* ============================================================
   DATA — games, library, whitelist
   ============================================================ */
let gamesRef = null;
function listenGames(){
  if(gamesRef) return;
  gamesRef = gamesDb.ref("games");
  gamesRef.on("value", snap => {
    games = snap.val() || {};
    gamesLoaded = true; dbError = null;
    render();
  }, err => {
    gamesLoaded = true;
    dbError = (err && err.code) || "database-error";
    render();
  });
}
let libraryRef = null;
function listenLibrary(){
  if(!me) return;
  if(libraryRef) libraryRef.off();
  libraryRef = gamesDb.ref("library/" + me.uid);
  libraryRef.on("value", snap => {
    library = snap.val() || {};
    if(currentRoute() === "library") render();
  });
}
function currentRoute(){
  const h = (window.location.hash || "").replace(/^#\/?/, "");
  const parts = h.split("/");
  return parts[0] || "store";
}
function currentGameIdFromHash(){
  const h = (window.location.hash || "").replace(/^#\/?/, "");
  const parts = h.split("/");
  return parts[0] === "game" ? (parts[1] || null) : null;
}
function currentEditIdFromHash(){
  const h = (window.location.hash || "").replace(/^#\/?/, "");
  const parts = h.split("/");
  return parts[0] === "edit" ? (parts[1] || null) : null;
}
function gameUrl(id){
  return window.location.origin + window.location.pathname + "#/game/" + id;
}
async function loadWhitelist(gameId){
  currentWhitelist = {};
  if(!gameId) return;
  try{
    const snap = await gamesDb.ref("whitelist/" + gameId).once("value");
    currentWhitelist = snap.val() || {};
  }catch(err){
    currentWhitelist = {};
  }
}
/* Resolve an AJG Mail address to a uid via the AJG Mail address index. */
async function resolveWhitelistAddress(addressInput){
  const local = localPart(addressInput);
  if(local === null || !validLocal(local)) return { ok:false, error:"Enter a valid @ajgmail.com address." };
  const snap = await rtdb.ref("ajgmail/addresses/" + local).once("value");
  if(!snap.exists()) return { ok:false, error:"No AJG Mail account with that address yet." };
  return { ok:true, uid: snap.val(), address: addressOf(local) };
}
async function addToWhitelist(gameId, addressInput){
  const game = games[gameId];
  if(!game || !canManageWhitelist(game, me)) return { ok:false, error:"Only the game's owner can change the whitelist." };
  const res = await resolveWhitelistAddress(addressInput);
  if(!res.ok) return res;
  if(res.uid === game.ownerUid) return { ok:false, error:"That's the owner — they already have access." };
  await gamesDb.ref("whitelist/" + gameId + "/" + res.uid).set({ address: res.address, addedAt: Date.now() });
  currentWhitelist[res.uid] = { address: res.address, addedAt: Date.now() };
  return { ok:true, address: res.address };
}
async function removeFromWhitelist(gameId, uid){
  const game = games[gameId];
  if(!game || !canManageWhitelist(game, me)) return false;
  await gamesDb.ref("whitelist/" + gameId + "/" + uid).remove();
  delete currentWhitelist[uid];
  return true;
}

/* ---------- install ---------- */
async function installGame(gameId){
  const game = games[gameId];
  if(!game) return { type:"none" };
  const act = installAction(game);
  if(act.type === "link"){
    window.open(act.url, "_blank");
  }else{
    toast("This game has no install link yet.");
    return { type:"none" };
  }
  /* record the install: download count + my library (when signed in) */
  try{
    await gamesDb.ref("games/" + gameId + "/downloads").transaction(n => (n || 0) + 1);
    if(me) await gamesDb.ref("library/" + me.uid + "/" + gameId).set({ addedAt: Date.now(), title: game.title });
  }catch(err){ /* installing still worked; the count is best-effort */ }
  toast("Opening the install link in a new tab.");
  return act;
}
/* Play from the library: opens the game's install link in a new tab,
   same as Install. */
async function playGame(gameId){
  const game = games[gameId];
  if(!game) return;
  await installGame(gameId);
}

/* Downscale a cover image to a 460x215 Steam capsule (center crop). */
function downscaleCover(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const c = document.createElement("canvas");
        c.width = 460; c.height = 215;
        const ctx = c.getContext("2d");
        const sr = img.width / img.height, tr = 460 / 215;
        let sw, sh, sx, sy;
        if(sr > tr){ sh = img.height; sw = sh * tr; sx = (img.width - sw) / 2; sy = 0; }
        else{ sw = img.width; sh = sw / tr; sx = 0; sy = (img.height - sh) / 2; }
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 460, 215);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.85));
      }catch(err){ URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad-image")); };
    img.src = url;
  });
}
async function publishGame(input){
  /* input: { title, description, tags, cover, visibility,
     installLink } — owner is `me`. Every game is link-only. */
  if(!me) throw new Error("not-signed-in");
  const err = validatePublish(input);
  if(err) throw new Error(err);
  const record = buildGameRecord(input, me);
  const ref = await gamesDb.ref("games").push(record);
  const id = ref.key;
  await gamesDb.ref("games/" + id + "/id").set(id);
  return id;
}
async function updateGame(gameId, input){
  const game = games[gameId];
  if(!game) throw new Error("not-found");
  if(!canEditGame(game, me)) throw new Error("not-allowed");
  const err = validatePublish(input);
  if(err) throw new Error(err);
  await gamesDb.ref("games/" + gameId).update(buildGameUpdate(input));
  return gameId;
}

  ["store","library","community"].forEach(t => {
    const el = $("tab-" + t);

  if(!dbError) return "";
  return '<div class="notice err">Couldn\'t reach the games database (' + esc(dbError) +
    '). Sign-in may still work, but games won\'t load or save until the database is reachable — check the Realtime Database API on the key and the database rules.</div>';

  if(game.cover) return '<img src="' + esc(game.cover) + '" alt="">';
  return '<span>' + esc(game.title || "AJG Games") + '</span>';
}
function tagHtml(tags){
  return (tags || []).map(t => '<span class="badge">' + esc(t) + '</span>').join("");
}

  if(game.visibility === "private") return '<span class="badge priv">Private</span>';
  if(game.visibility === "unlisted") return '<span class="badge unl">Unlisted</span>';

      go("store");
    }catch(err){
      errBox.textContent = err.message === "bad-address" ? "Enter a valid @ajgmail.com address." : authErrorFor(err);
    }
  });
}

/* ---------- community (v1: coming soon) ---------- */
function renderCommunity(){
  setTab("community");
  $("view").innerHTML = '<h1>Community</h1>' +
    '<div class="empty"><h2>Community is coming soon.</h2><p>Friends, groups and chat aren\'t in v1 — the store, library and publishing come first.</p></div>';
}

/* ---------- router ---------- */
function render(){
  const route = currentRoute();
  if(route === "game"){ renderGamePage(); return; }
  if(route === "edit"){ renderEditGame(); return; }
  if(route === "library"){ renderLibrary(); return; }
  if(route === "publish"){ renderPublish(); return; }
  if(route === "signin"){ renderSignin(); return; }
  if(route === "community"){ renderCommunity(); return; }
  renderStore();
}

/* ---------- public API (used by onclick handlers + the test harness) ---------- */
window.AJGGames = {
  go, render, install: installGame, play: playGame,
  signOut: () => auth.signOut(),
  publishGame, updateGame, signInWithAjgMail, resolveWhitelistAddress,
  addToWhitelist, removeFromWhitelist,
  canEditGame, buildGameUpdate, isRoot,
  canViewGame, storeGames, installAction,
  parseTags, isValidInstallLink, isOwner, canManageWhitelist,
  buildGameRecord, validatePublish,
  addWhitelist: async (gameId) => {
    const box = $("wl-address"), errBox = $("wl-error");
    if(!box) return;
    const res = await addToWhitelist(gameId, box.value);
    if(!res.ok){ if(errBox) errBox.textContent = res.error || "Couldn't add that address."; return; }
    toast(res.address + " can now see this game.");
    renderGamePage();
  },
  removeWhitelist: async (gameId, uid) => {
    await removeFromWhitelist(gameId, uid);
    renderGamePage();
  },
  copyGameLink: (gameId) => {
    const url = gameUrl(gameId);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(() => toast("Link copied."), () => toast(url));
    }else{
      const ta = document.createElement("textarea");
      ta.value = url; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast("Link copied."); }catch(e){ toast(url); }
      ta.remove();
    }
  }
};

/* ---------- init ---------- */
$("nav-back").onclick = () => window.history.back();
$("nav-fwd").onclick = () => window.history.forward();
window.addEventListener("hashchange", render);
$("search-btn").onclick = () => { searchQuery = $("search-box").value; go("store"); };
$("search-box").addEventListener("input", () => {
  searchQuery = $("search-box").value;
  if(currentRoute() === "store") renderStore();
});
$("search-box").addEventListener("keydown", e => {
  if(e.key === "Enter"){ searchQuery = $("search-box").value; go("store"); }
});
listenGames();
renderAccount();
render();
</script>
</body>
